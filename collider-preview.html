<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>碰撞网格 · 本地预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#111917;color:#e8f1e9;font:14px/1.7 system-ui,sans-serif}canvas{display:block}
    aside{position:fixed;top:24px;left:24px;width:310px;padding:24px;background:#16211eee;border:1px solid #3b5247;border-radius:18px;max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 12px 50px #0004}
    h1{font-size:24px;margin:10px 0 8px}p{color:#acbeb4;margin:10px 0}small,.eyebrow{color:#aed899;font-size:11px;letter-spacing:1px}label{display:flex;justify-content:space-between;align-items:center;margin:16px 0}input{accent-color:#bbe39f}input[type=range]{width:120px}
    hr{border:0;border-top:1px solid #34463c;margin:20px 0}button,a{font:inherit;color:#e8f1e9;border:1px solid #49604e;border-radius:8px;background:#24392b;padding:8px 12px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#344e39}button:focus-visible,a:focus-visible{outline:2px solid #c9eaa8;outline-offset:3px}.buttons{display:flex;gap:8px;flex-wrap:wrap}dl{display:grid;grid-template-columns:1fr 1fr;font-size:13px}dt{color:#acbeb4}dd{text-align:right;margin:0}
    #status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14241fee;border:1px solid #46604f;padding:10px 18px;border-radius:12px;max-width:90vw}#picked{font-size:12px;min-height:42px}#warning{font-size:12px;color:#dcca9d}a.download{display:block;text-align:center;margin-top:10px}
    @media(max-width:640px){aside{top:12px;left:12px;width:260px;padding:16px;max-height:55vh}h1{font-size:20px}}
  </style>
</head>
<body>
  <aside>
    <div class="eyebrow">LOCAL / COLLISION MESH</div>
    <h1>施工区碰撞网格</h1>
    <p>叠加源点云，检查地面和结构是否对齐。</p>
    <dl><dt>三角面</dt><dd id="faces">—</dd><dt>网格文件</dt><dd id="size">—</dd><dt>范围</dt><dd>原点附近 80 × 80</dd></dl>
    <hr/>
    <label>碰撞表面 <input type="checkbox" id="surface" checked/></label>
    <label>源点云 <input type="checkbox" id="points" checked/></label>
    <label>三角线框 <input type="checkbox" id="wire"/></label>
    <label>表面透明度 <input type="range" id="opacity" min="0.1" max="1" value="0.7" step="0.05"/></label>
    <div class="buttons"><button id="overview">全景</button><button id="spawn">出生点附近</button><button id="top">俯视</button></div>
    <hr/>
    <p id="picked">双击网格可检查表面坐标。</p>
    <p id="warning">局部重建预览：边缘和缺失区域未封口，植被、细柱和孔洞需复核。此页未启用人物碰撞。</p>
    <a class="download" href="./collision/scene-collider.glb" download>下载碰撞网格 GLB</a>
    <a class="download" href="./">返回场景漫游</a>
  </aside>
  <div id="status" role="status">正在读取本地碰撞网格…</div>
  <script type="module" src="/src/collider-preview.js"></script>
</body>
</html>
